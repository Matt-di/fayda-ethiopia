name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Plain PHP core (no Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install production dependencies only
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Verify the core autoloads without Laravel
        run: php -r "require 'vendor/autoload.php'; echo Mattdi\Fayda\Core\Pkce::verifier();"

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12']
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin the Laravel/Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
